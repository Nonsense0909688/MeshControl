<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeshControl · Models</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-nav="models" data-search="Filter models…">
<div id="view">
  <div class="hd">
    <div><h1>Models</h1><p id="sub">Loading…</p></div>
  </div>

  <div class="grid g4" id="stats"></div>

  <section class="card" id="pullcard">
    <h2>Pull a model</h2>
    <form class="form" id="pullform" autocomplete="off">
      <label class="grow">Model name
        <input id="pm" list="suggest" placeholder="e.g. llama3.2:3b" required maxlength="256" spellcheck="false">
      </label>
      <datalist id="suggest">
        <option value="llama3.2:1b"><option value="llama3.2:3b"><option value="llama3.1:8b">
        <option value="qwen2.5:0.5b"><option value="qwen2.5:7b"><option value="qwen3:8b">
        <option value="gemma2:2b"><option value="gemma3:4b"><option value="mistral:7b">
        <option value="phi3:mini"><option value="deepseek-r1:7b"><option value="nomic-embed-text">
      </datalist>
      <label>Download to
        <select id="pn" aria-label="Node to pull to"></select>
      </label>
      <button class="pri" type="submit" id="pgo">Pull model</button>
    </form>
    <p class="msg-err" id="perr" hidden></p>
    <p class="hint">The node downloads the model itself, so large models can take a while. You can leave this page and come back; progress is tracked by the controller. Browse names in the <a href="https://ollama.com/library" target="_blank" rel="noopener noreferrer">Ollama library</a>.</p>
  </section>

  <section class="card" id="dlcard" hidden>
    <h2>Downloads</h2>
    <div id="downloads"></div>
  </section>

  <section class="card">
    <h2>Installed models</h2>
    <div id="table"></div>
  </section>
</div>
<script src="/static/common.js"></script>
<script src="/static/pulls.js"></script>
<script src="/static/models.js"></script>
</body>
</html>
