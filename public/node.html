<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeshControl · Node</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-nav="nodes">
<div id="view">
  <div id="nf" hidden></div>
  <div id="content" hidden>
    <div class="crumb"><a href="/nodes">Nodes</a> / <span id="crumbname"></span></div>
    <div class="hd">
      <div><h1><span id="title"></span><span id="badge"></span></h1><p id="sub"></p></div>
      <div class="acts">
        <a class="btn" id="pulllink" href="/models?pull=1">Pull a model</a>
        <a class="btn pri" id="chatlink" href="/chat">Chat with this node</a>
      </div>
    </div>
    <div id="alert"></div>
    <div class="grid g4" id="stats"></div>
    <section class="card">
      <h2>CPU &amp; RAM history <span id="clegend"></span></h2>
      <div id="chart"></div>
    </section>
    <section class="card">
      <h2>Installed models</h2>
      <div id="models"></div>
    </section>
    <section class="card">
      <h2>Details</h2>
      <div id="details"></div>
    </section>
    <section class="card">
      <details><summary>Raw record</summary><pre id="raw"></pre></details>
    </section>
  </div>
</div>
<script src="/static/common.js"></script>
<script src="/static/node.js"></script>
</body>
</html>
