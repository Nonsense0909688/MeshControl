<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeshControl · Chat</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet"
 href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body data-nav="chat">
<div id="view">
  <section class="chat">
    <div class="chat-bar">
      <div><h1>Chat</h1><small id="route">Connecting…</small></div>
      <div class="chat-ctl">
        <select id="cm" aria-label="Model"><option>Loading…</option></select>
        <select id="cn" aria-label="Node"><option value="">Auto-route</option></select>
        <button id="newchat" type="button">New chat</button>
      </div>
    </div>
    <div class="chat-scroll" id="scroll" aria-live="polite"><div class="chat-col" id="thread"></div></div>
    <div class="chat-compose">
      <div class="chat-col">
        <div class="composer">
          <textarea id="ta" rows="1" placeholder="Message the cluster…" aria-label="Message" spellcheck="true"></textarea>
          <button id="thinking" class="thinking-btn" type="button"
                  aria-label="Toggle thinking" aria-pressed="false"
                  title="Thinking mode">
           <svg width="16" height="16" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true">
  <path d="M9 18h6M10 22h4"/>
  <path d="M8.5 15.5A7 7 0 1 1 15.5 15.5
           C14.5 16.5 14 17 14 18h-4
           c0-1-.5-2-1.5-2.5Z"/>
  <path d="M12 4v2M5 11H3M21 11h-2"/>
</svg>
            <span>Think</span>
          </button>
          <button id="send" class="send pri" type="button" aria-label="Send message">↑</button>
        </div>
        <p class="fine">Local models can make mistakes. Enter to send, Shift+Enter for a new line.</p>
      </div>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="/static/common.js"></script>
<script src="/static/chat.js"></script>
</body>
</html>
